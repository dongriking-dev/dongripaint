async function inviteFriendToCanvas(friendUid) {
  if (activeSessionId) { showToast('既に共同描画セッション中です', 'error'); return; }
  try {
    showLoading(true);
    const sessionRef = push(ref(db, 'sessions'));
    const sessionId = sessionRef.key;
    const friend = friends[friendUid];
    const sessionData = {
      ownerId: currentUser.uid,
      ownerName: currentUser.displayName || '名無し',
      guestId: friendUid,
      guestName: friend ? friend.displayName : '名無し',
      status: 'pending',
      createdAt: Date.now(),
      startedAt: null
    };
    await set(sessionRef, sessionData);
    await set(ref(db, 'sessionInvites/' + friendUid + '/' + sessionId), true);
    activeSessionId = sessionId;
    sessionRole = 'owner';
    await attachSessionListener(sessionId);
    showToast(`${friend.displayName} さんに招待を送信しました`, 'success');
    inviteModal.classList.remove('show');
  } catch (e) {
    console.error(e);
    showToast('招待に失敗: ' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

async function attachSessionListener(sessionId) {
  if (sessionUnsubscribe) { try { sessionUnsubscribe(); } catch(e){} sessionUnsubscribe = null; }
  sessionUnsubscribe = onValue(ref(db, 'sessions/' + sessionId), async (snap) => {
    if (!snap.exists()) {
      if (activeSessionId === sessionId) {
        await cleanupSession();
        showToast('セッションが終了しました');
      }
      return;
    }
    const s = snap.val();
    if (activeSessionId !== sessionId) activeSessionId = sessionId;
    if (s.status === 'active') {
      collabBadge.classList.add('show');
      collabBadgeText.textContent = `共同描画中: ${sessionRole === 'owner' ? s.guestName : s.ownerName}`;
      if (!strokesUnsubscribe) {
        startStrokesListener(sessionId);
      }
    } else if (s.status === 'declined') {
      showToast('招待が拒否されました', 'error');
      await cleanupSession();
    } else if (s.status === 'ended') {
      showToast('セッションが終了しました');
      await cleanupSession();
    }
  });
}

function showIncomingInvite(sessionId, session) {
  incomingInviteBody.innerHTML = `<b>${escapeHtml(session.ownerName)}</b> さんが共同描画に招待しています。<br>参加しますか？`;
  const newAccept = inviteAcceptBtn.cloneNode(true);
  const newDecline = inviteDeclineBtn.cloneNode(true);
  inviteAcceptBtn.parentNode.replaceChild(newAccept, inviteAcceptBtn);
  inviteDeclineBtn.parentNode.replaceChild(newDecline, inviteDeclineBtn);

  newAccept.addEventListener('click', async () => {
    incomingInviteModal.classList.remove('show');
    pendingInviteShown = null;
    try {
      showLoading(true);
      await update(ref(db, 'sessions/' + sessionId), { status: 'active', startedAt: Date.now() });
      await remove(ref(db, 'sessionInvites/' + currentUser.uid + '/' + sessionId));
      activeSessionId = sessionId;
      sessionRole = 'guest';
      await attachSessionListener(sessionId);
      collabBadge.classList.add('show');
      collabBadgeText.textContent = '共同描画中';
      startStrokesListener(sessionId);
      showToast('セッションに参加しました', 'success');
    } catch (e) {
      console.error(e);
      showToast('参加に失敗: ' + e.message, 'error');
    } finally {
      showLoading(false);
    }
  });
  newDecline.addEventListener('click', async () => {
    incomingInviteModal.classList.remove('show');
    pendingInviteShown = null;
    try {
      await update(ref(db, 'sessions/' + sessionId), { status: 'declined' });
      await remove(ref(db, 'sessionInvites/' + currentUser.uid + '/' + sessionId));
    } catch (e) { console.error(e); }
  });
  incomingInviteModal.classList.add('show');
}

function startStrokesListener(sessionId) {
  if (strokesUnsubscribe) { try { strokesUnsubscribe(); } catch(e){} strokesUnsubscribe = null; }
  const strokesRef = ref(db, 'strokes/' + sessionId);
  const existingKeys = new Set();
  const initialLoad = new Promise((resolve) => {
    get(strokesRef).then((snap) => {
      if (snap.exists()) Object.keys(snap.val()).forEach(k => existingKeys.add(k));
      resolve();
    }).catch(() => resolve());
  });

  strokesUnsubscribe = onChildAdded(strokesRef, async (childSnap) => {
    await initialLoad;
    const key = childSnap.key;
    if (existingKeys.has(key)) return;
    const stroke = childSnap.val();
    if (!stroke) return;
    if (stroke.uid === currentUser.uid) return;
    applyRemoteStroke(stroke);
  });
}

function applyRemoteStroke(stroke) {
  applyingRemote = true;
  try {
    const layer = getActiveLayer();
    if (!layer || !layer.visible) return;
    if (stroke.type === 'start') {
      remoteStrokeState[stroke.uid] = {
        lastX: stroke.x, lastY: stroke.y,
        color: stroke.color, size: stroke.size,
        brush: stroke.brush, opacity: stroke.opacity, eraser: stroke.eraser
      };
      drawStrokeToLayer(layer, stroke.x, stroke.y, stroke.x + 0.01, stroke.y, {
        color: stroke.color, size: stroke.size,
        brush: stroke.brush, alpha: stroke.opacity || 1, eraser: stroke.eraser
      });
      composite();
    } else if (stroke.type === 'move') {
      const state = remoteStrokeState[stroke.uid];
      if (!state) return;
      drawStrokeToLayer(layer, state.lastX, state.lastY, stroke.x, stroke.y, {
        color: state.color, size: state.size,
        brush: state.brush, alpha: state.opacity || 1, eraser: state.eraser
      });
      state.lastX = stroke.x;
      state.lastY = stroke.y;
      composite();
    } else if (stroke.type === 'end') {
      delete remoteStrokeState[stroke.uid];
    }
  } finally {
    applyingRemote = false;
  }
}

async function sendStroke(stroke) {
  if (!activeSessionId) return;
  if (applyingRemote) return;
  try {
    const r = push(ref(db, 'strokes/' + activeSessionId));
    await set(r, {
      ...stroke,
      uid: currentUser.uid,
      timestamp: Date.now()
    });
  } catch (e) { /* 無視 */ }
}

async function cleanupSession() {
  if (sessionUnsubscribe) { try { sessionUnsubscribe(); } catch(e){} sessionUnsubscribe = null; }
  if (strokesUnsubscribe) { try { strokesUnsubscribe(); } catch(e){} strokesUnsubscribe = null; }
  remoteStrokeState = {};
  collabBadge.classList.remove('show');
  if (activeSessionId) {
    try {
      await update(ref(db, 'sessions/' + activeSessionId), { status: 'ended' });
      await remove(ref(db, 'sessionInvites/' + currentUser.uid + '/' + activeSessionId));
      await remove(ref(db, 'strokes/' + activeSessionId));
    } catch (e) {}
  }
  activeSessionId = null;
  sessionRole = null;
}
