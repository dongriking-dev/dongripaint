<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #1e1f24; color: #e6e7ea; }
  .icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; flex-shrink: 0; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-lg { width: 24px; height: 24px; }
  button { font-family: inherit; }
  input { font-family: inherit; }

  #loginScreen { position: fixed; inset: 0; background: linear-gradient(150deg, #2a2d34 0%, #1a1c21 100%); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; z-index: 100; }
  #loginScreen.hidden { display: none; }
  .login-box { background: #26282e; border-radius: 20px; padding: 40px 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid #383b42; text-align: center; max-width: 420px; }
  .login-box h1 { margin: 0 0 8px; font-size: 1.8rem; font-weight: 600; color: #fff; letter-spacing: 1px; }
  .login-box p { color: #8592a3; font-size: 0.9rem; margin: 0 0 28px; }
  .google-btn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #333; border: none; padding: 12px 24px; border-radius: 40px; font-size: 0.95rem; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.3); cursor: pointer; }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn svg { width: 20px; height: 20px; }
  .login-error { margin-top: 16px; padding: 10px 14px; background: #3a2222; border: 1px solid #5a2a2a; border-radius: 8px; color: #ff9a8f; font-size: 0.78rem; text-align: left; }

  #homeScreen { position: fixed; inset: 0; background: linear-gradient(150deg, #f4f6fa 0%, #dfe6f0 100%); overflow-y: auto; padding: 40px 24px 80px; color: #2b3440; display: block; z-index: 10; }
  #homeScreen.hidden { display: none; }
  .home-header { max-width: 1100px; margin: 0 auto 40px; text-align: center; }
  .home-header h1 { font-size: 2rem; font-weight: 600; margin: 0 0 8px; color: #2b3440; }
  .home-header p { color: #6b7686; margin: 0; font-size: 0.9rem; }
  .home-actions { max-width: 1100px; margin: 0 auto 50px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .home-action-btn { width: 220px; height: 200px; background: #ffffff; border: 1.5px solid #d5dde8; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; cursor: pointer; transition: all 0.18s ease; box-shadow: 0 6px 18px rgba(30,50,80,0.08); color: #2b3440; }
  .home-action-btn:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(30,50,80,0.15); border-color: #3a4a5e; }
  .home-action-btn .big-icon { width: 56px; height: 56px; color: #2b3440; }
  .home-action-btn .label { font-size: 1.05rem; font-weight: 600; }
  .home-action-btn .sublabel { font-size: 0.75rem; color: #8592a3; }
  .home-section-title { max-width: 1100px; margin: 0 auto 16px; display: flex; align-items: baseline; gap: 10px; font-size: 1.05rem; font-weight: 600; color: #2b3440; padding-left: 4px; }
  .home-section-title .count { font-size: 0.85rem; color: #8592a3; font-weight: 400; }
  .gallery { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
  .gallery-item { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px rgba(30,50,80,0.06); cursor: pointer; transition: all 0.18s ease; position: relative; display: flex; flex-direction: column; }
  .gallery-item:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(30,50,80,0.14); }
  .gallery-thumb { width: 100%; aspect-ratio: 4/3; background: #f4f6fa; object-fit: contain; display: block; }
  .gallery-info { padding: 10px 12px; }
  .gallery-name { font-size: 0.85rem; font-weight: 600; color: #2b3440; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gallery-date { font-size: 0.68rem; color: #8592a3; margin-top: 2px; }
  .gallery-delete { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.95); border: 1px solid #e2e8f0; color: #c0392b; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
  .gallery-item:hover .gallery-delete { opacity: 1; }
  .empty-gallery { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #8592a3; font-size: 0.9rem; background: rgba(255,255,255,0.6); border-radius: 16px; border: 1px dashed #c8d2df; }

  #editorScreen { position: fixed; inset: 0; background: #1e1f24; display: none; flex-direction: column; overflow: hidden; }
  #editorScreen.active { display: flex; }
  .top-bar { height: 56px; background: #1e1f24; display: flex; align-items: center; padding: 0 14px; gap: 12px; border-bottom: 1px solid #2c2e34; flex-shrink: 0; z-index: 20; }
  .top-btn { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: none; color: #d0d4dc; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .top-btn:hover { background: #2c2e34; color: #fff; }
  .top-btn.primary { background: #3b4048; color: #fff; }
  .top-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .top-title { flex: 1; text-align: center; font-size: 0.85rem; font-weight: 500; color: #b6bcc7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; padding: 0 10px; min-width: 0; }
  .top-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; position: relative; }
  .zoom-display { font-size: 0.75rem; color: #9aa1ad; background: #2c2e34; padding: 5px 10px; border-radius: 20px; font-weight: 600; min-width: 52px; text-align: center; cursor: pointer; }
  .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #454952; cursor: pointer; background: #2b2d33; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .notif-badge { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; background: #e74c3c; color: #fff; border-radius: 10px; font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #1e1f24; pointer-events: none; }

  .editor-body { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; }
  .left-toolbar { width: 64px; background: #26282e; border-right: 1px solid #2c2e34; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; flex-shrink: 0; overflow-y: auto; z-index: 15; }
  .tool-btn { width: 46px; height: 46px; border-radius: 12px; background: transparent; border: none; color: #aab0bb; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  .tool-btn:hover { background: #32353c; color: #fff; }
  .tool-btn.active { background: #3b4048; color: #fff; }
  .tool-btn.active::before { content: ''; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 3px; height: 22px; background: #5b8def; border-radius: 2px; }
  .tool-separator { width: 30px; height: 1px; background: #383b42; margin: 6px 0; flex-shrink: 0; }

  .brush-panel { width: 220px; background: #2b2d33; border-right: 1px solid #2c2e34; padding: 14px 12px; flex-shrink: 0; overflow-y: auto; z-index: 14; display: none; flex-direction: column; }
  .brush-panel.show { display: flex; }
  .panel-section-title { font-size: 0.7rem; font-weight: 600; color: #7e8694; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0 10px; }
  .brush-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .brush-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 6px; border-radius: 10px; background: #232529; border: 1px solid transparent; color: #c8cdd6; cursor: pointer; font-size: 0.72rem; }
  .brush-item:hover { background: #34373e; color: #fff; }
  .brush-item.active { background: #343b48; border-color: #5b8def; color: #fff; }

  .canvas-area { flex: 1; overflow: hidden; background: #14151a; position: relative; min-width: 0; }
  .canvas-viewport { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .canvas-viewport.pan-mode { cursor: grab; }
  .canvas-viewport.pan-mode:active { cursor: grabbing; }
  .canvas-viewport.zoom-mode { cursor: zoom-in; }
  .canvas-viewport.zoom-mode:active { cursor: zoom-out; }
  .canvas-transform { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .canvas-frame { position: relative; background: repeating-conic-gradient(#c8cdd6 0% 25%, #ffffff 0% 50%) 50% / 16px 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); line-height: 0; border-radius: 2px; }
  #drawCanvas { display: block; width: 100%; height: 100%; border-radius: 2px; cursor: crosshair; touch-action: none; background: transparent; }
  #drawCanvas.eraser-mode { cursor: cell; }
  #drawCanvas.move-mode { cursor: move; }
  #drawCanvas.eyedropper-mode { cursor: copy; }
  #drawCanvas.fill-mode { cursor: cell; }

  .collab-badge { position: absolute; top: 16px; left: 16px; background: #2b2d33; border: 1px solid #5b8def; padding: 8px 14px; border-radius: 30px; font-size: 0.78rem; color: #fff; display: none; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 25; }
  .collab-badge.show { display: flex; }
  .collab-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #5bdf8d; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .participants-bar { position: absolute; top: 16px; right: 16px; display: none; align-items: center; z-index: 25; }
  .participants-bar.show { display: flex; }
  .participant-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #5b8def; background: #2b2d33; object-fit: cover; margin-left: -10px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .participant-avatar:first-child { margin-left: 0; }
  .participant-count { margin-left: 6px; font-size: 0.7rem; color: #b6bcc7; background: #2b2d33; padding: 4px 8px; border-radius: 12px; border: 1px solid #383b42; }

  .image-edit-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; display: none; z-index: 50; }
  .image-edit-overlay.active { display: block; }
  .image-edit-box { position: absolute; border: 2px dashed #5b8def; pointer-events: auto; cursor: move; box-sizing: border-box; }
  .image-edit-handle { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid #5b8def; border-radius: 50%; pointer-events: auto; }
  .image-edit-handle.tl { top: -8px; left: -8px; cursor: nwse-resize; }
  .image-edit-handle.tr { top: -8px; right: -8px; cursor: nesw-resize; }
  .image-edit-handle.bl { bottom: -8px; left: -8px; cursor: nesw-resize; }
  .image-edit-handle.br { bottom: -8px; right: -8px; cursor: nesw-resize; }
  .image-edit-handle.rotate { top: -36px; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; background: #5b8def; border-color: #fff; cursor: grab; border-radius: 50%; }
  .image-edit-toolbar { position: absolute; background: #2b2d33; border: 1px solid #383b42; border-radius: 10px; padding: 6px; display: flex; gap: 4px; pointer-events: auto; z-index: 100; transform: translate(-50%, -100%); }
  .image-edit-toolbar button { width: 34px; height: 34px; border-radius: 6px; background: transparent; border: none; color: #c8cdd6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .image-edit-toolbar button.confirm { color: #5bdf8d; }
  .image-edit-toolbar button.cancel { color: #ff8b7f; }

  .zoom-controls { position: absolute; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 4px; background: #2b2d33; border-radius: 10px; padding: 4px; border: 1px solid #383b42; z-index: 20; }
  .zoom-btn { width: 34px; height: 34px; border-radius: 6px; background: transparent; border: none; color: #c8cdd6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: #3b4048; color: #fff; }

  /* 手ブレ補正インジケーター */
  .stabilizer-indicator { position: absolute; bottom: 16px; left: 16px; background: #2b2d33; border: 1px solid #5bdf8d; padding: 6px 12px; border-radius: 20px; font-size: 0.72rem; color: #5bdf8d; display: none; align-items: center; gap: 6px; z-index: 25; }
  .stabilizer-indicator.show { display: flex; }
  .stabilizer-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: #5bdf8d; animation: pulse 1.5s ease-in-out infinite; }

  .right-panels { width: 280px; background: #26282e; border-left: 1px solid #2c2e34; overflow-y: auto; flex-shrink: 0; padding: 14px; display: flex; flex-direction: column; gap: 14px; z-index: 15; }
  .panel { background: #2b2d33; border-radius: 12px; border: 1px solid #383b42; padding: 14px; color: #d0d4dc; font-size: 0.82rem; }
  .panel-title { font-size: 0.72rem; font-weight: 600; color: #9aa1ad; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

  .color-main-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .color-swatch-big { width: 48px; height: 48px; border-radius: 10px; border: 2px solid #454952; cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0; }
  .color-swatch-big .checker { position: absolute; inset: 0; background: repeating-conic-gradient(#c8c8c8 0% 25%, #ffffff 0% 50%) 50% / 10px 10px; z-index: 0; }
  .color-swatch-big .fill { position: absolute; inset: 0; z-index: 1; }
  .color-hex-row { flex: 1; display: flex; align-items: center; background: #1e1f24; border-radius: 8px; border: 1px solid #383b42; padding: 0 10px; height: 40px; min-width: 0; }
  .color-hex-row .hash { color: #7e8694; font-size: 0.85rem; font-weight: 600; margin-right: 2px; }
  .color-hex-row input { flex: 1; background: transparent; border: none; color: #e6e7ea; font-size: 0.85rem; font-family: monospace; outline: none; text-transform: uppercase; }
  .eyedropper-btn { width: 40px; height: 40px; border-radius: 8px; background: #1e1f24; border: 1px solid #383b42; color: #c8cdd6; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  .picker-tabs { display: flex; gap: 4px; margin-bottom: 10px; background: #1e1f24; padding: 3px; border-radius: 8px; }
  .picker-tab { flex: 1; padding: 6px 8px; border-radius: 6px; background: transparent; border: none; color: #8592a3; cursor: pointer; font-size: 0.72rem; font-weight: 600; }
  .picker-tab.active { background: #3b4048; color: #fff; }
  .picker-panel { display: none; }
  .picker-panel.active { display: block; }
  .chan-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .chan-label { width: 22px; font-size: 0.72rem; font-weight: 700; color: #9aa1ad; text-align: center; }
  .chan-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; outline: none; }
  .chan-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #2b2d33; cursor: pointer; }
  .chan-value { width: 36px; font-size: 0.72rem; color: #e6e7ea; text-align: right; font-family: monospace; }
  #sliderR { background: linear-gradient(to right, #000, #f00); }
  #sliderG { background: linear-gradient(to right, #000, #0f0); }
  #sliderB { background: linear-gradient(to right, #000, #00f); }
  #sliderH { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  #sliderS { background: linear-gradient(to right, hsl(0,0%,50%), hsl(0,100%,50%)); }
  #sliderL { background: linear-gradient(to right, #000, #888, #fff); }
  .preset-title { font-size: 0.68rem; font-weight: 600; color: #7e8694; margin: 12px 0 8px; }
  .color-presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .color-preset { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: 0 0 0 1px #454952; position: relative; overflow: hidden; }
  .color-preset.active { border-color: #fff; }
  .color-preset .fill { position: absolute; inset: 0; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .slider-label { width: 46px; font-size: 0.75rem; color: #b6bcc7; flex-shrink: 0; }
  .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 3px; border-radius: 3px; background: #4a4e57; outline: none; }
  .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #5b8def; border: 2px solid #2b2d33; cursor: pointer; }
  .size-preview { width: 44px; height: 36px; background: #1e1f24; border-radius: 6px; border: 1px solid #383b42; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tolerance-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

  .layer-list { display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
  .layer-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; background: #232529; border: 1px solid transparent; cursor: pointer; touch-action: none; position: relative; }
  .layer-item.selected { background: #343b48; border-color: #5b8def; }
  .layer-thumb { width: 34px; height: 28px; border-radius: 4px; background: repeating-conic-gradient(#c8cdd6 0% 25%, #ffffff 0% 50%) 50% / 6px 6px; object-fit: contain; flex-shrink: 0; pointer-events: none; }
  .layer-info { flex: 1; min-width: 0; pointer-events: none; }
  .layer-name { font-size: 0.78rem; color: #e6e7ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .layer-meta { font-size: 0.65rem; color: #7e8694; margin-top: 1px; }
  .layer-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .mini-btn { width: 24px; height: 24px; border-radius: 6px; background: transparent; border: none; color: #9aa1ad; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mini-btn:hover { background: #3b4048; color: #fff; }
  .mini-btn.visibility.off { opacity: 0.4; }
  .layer-item.insert-above::before, .layer-item.insert-below::after { content: ''; position: absolute; left: 4px; right: 4px; height: 2px; background: #5b8def; border-radius: 2px; }
  .layer-item.insert-above::before { top: -3px; }
  .layer-item.insert-below::after { bottom: -3px; }
  .layer-controls { display: flex; gap: 6px; }
  .layer-controls button { flex: 1; height: 32px; border-radius: 8px; background: #232529; border: 1px solid #383b42; color: #d0d4dc; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.72rem; }

  .friend-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .friend-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: #232529; border: 1px solid #383b42; }
  .friend-item img { width: 32px; height: 32px; border-radius: 50%; background: #1e1f24; flex-shrink: 0; }
  .friend-item .friend-info { flex: 1; min-width: 0; }
  .friend-item .name { font-size: 0.8rem; color: #e6e7ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .friend-item .email { font-size: 0.65rem; color: #7e8694; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .friend-item button { background: #3b4048; border: none; color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; flex-shrink: 0; }
  .friend-item button:hover { background: #5b8def; }
  .friend-item button.accept { background: #2a7a4a; }
  .friend-item .invite-check { width: 20px; height: 20px; accent-color: #5b8def; flex-shrink: 0; }
  .friend-empty { text-align: center; color: #7e8694; font-size: 0.78rem; padding: 16px 8px; }
  .add-friend-row { display: flex; gap: 6px; margin-top: 10px; }
  .add-friend-row input { flex: 1; background: #1e1f24; border: 1px solid #383b42; color: #e6e7ea; padding: 8px 12px; border-radius: 8px; font-size: 0.78rem; outline: none; min-width: 0; }
  .add-friend-row button { background: #5b8def; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; }
  .add-friend-msg { font-size: 0.72rem; color: #8592a3; margin-top: 8px; min-height: 1em; }
  .add-friend-msg.error { color: #ff8b7f; }
  .add-friend-msg.success { color: #5bdf8d; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: #2b2d33; border-radius: 16px; border: 1px solid #383b42; padding: 24px; min-width: 320px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 8px; font-size: 1.05rem; color: #fff; }
  .modal p { margin: 0 0 20px; color: #b6bcc7; font-size: 0.85rem; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btn { padding: 8px 20px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .modal-btn.primary { background: #5b8def; color: #fff; }
  .modal-btn.secondary { background: #383b42; color: #d0d4dc; }
  .modal-btn.danger { background: #e74c3c; color: #fff; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2b2d33; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.82rem; border: 1px solid #383b42; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 2000; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: #5bdf8d; }
  .toast.error { border-color: #ff8b7f; }

  #loadingIndicator { position: fixed; inset: 0; background: rgba(20,21,26,0.85); display: none; align-items: center; justify-content: center; z-index: 3000; flex-direction: column; gap: 16px; color: #d0d4dc; }
  #loadingIndicator.show { display: flex; }
  .spinner { width: 44px; height: 44px; border: 3px solid #383b42; border-top-color: #5b8def; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 700px) { .right-panels { display: none; } }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>どんぐりペイント</h1>
    <p>友達と一緒に絵を描こう</p>
    <button class="google-btn" id="googleLoginBtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Googleでログイン
    </button>
    <div id="loginError" class="login-error" style="display:none;"></div>
  </div>
</div>

<div id="homeScreen" class="hidden">
  <div class="home-header"><h1>どんぐりペイント</h1><p>あなたの作品を描いて、保存して、いつでも続きから</p></div>
  <div class="home-actions">
    <div class="home-action-btn" id="newArtBtn"><svg class="big-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><div class="label">作成＋</div><div class="sublabel">白紙から新しく描く</div></div>
    <div class="home-action-btn" id="imageStartBtn"><svg class="big-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><div class="label">画像から始める</div><div class="sublabel">画像を読み込んで編集</div></div>
  </div>
  <div class="home-section-title"><span>自分の作品</span><span class="count" id="galleryCount"></span></div>
  <div class="gallery" id="gallery"></div>
</div>

<div id="editorScreen">
  <div class="top-bar">
    <button class="top-btn" id="backHomeBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
    <div class="top-group">
      <button class="top-btn" id="undoBtn" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg></button>
      <button class="top-btn" id="redoBtn" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 014-4h12"/></svg></button>
    </div>
    <div class="top-title" id="artTitle">無題の作品</div>
    <div class="top-group">
      <span class="zoom-display" id="zoomDisplay">100%</span>
      <button class="top-btn" id="friendsBtn" style="position:relative;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><span class="notif-badge" id="friendNotifBadge" style="display:none;">0</span></button>
      <button class="top-btn primary" id="inviteBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></button>
      <button class="top-btn" id="saveBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <div class="user-avatar" id="userAvatar"><img id="userAvatarImg" src="" alt=""></div>
    </div>
  </div>

  <div class="editor-body">
    <div class="left-toolbar">
      <button class="tool-btn active" id="brushToggleBtn"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 114.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 00-3-3.02z"/></svg></button>
      <button class="tool-btn" id="fillToggle"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 11l-8-8-8.5 8.5a2 2 0 000 2.8l5.2 5.2a2 2 0 002.8 0L19 11z"/><path d="M5 2l3 3"/><path d="M2 13h15"/><path d="M20 15c-1.5 2-2 3-2 4a2 2 0 104 0c0-1-.5-2-2-4z"/></svg></button>
      <button class="tool-btn" id="eraserToggle"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 20H7L3 16a2 2 0 010-3L13 3a2 2 0 013 0l5 5a2 2 0 010 3l-9 9"/><line x1="8" y1="12" x2="14" y2="18"/></svg></button>
      <button class="tool-btn" id="eyedropperToolBtn"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 12l-7 7-1 3 3-1 7-7"/><path d="M13 10l4-4a2.83 2.83 0 114 4l-4 4"/></svg></button>
      <button class="tool-btn" id="moveToggle"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg></button>
      <!-- 手ブレ補正トグル -->
      <button class="tool-btn" id="stabilizerToggle" title="手ブレ補正"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg></button>
      <div class="tool-separator"></div>
      <button class="tool-btn" id="panToggle" title="キャンバス移動"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 11V6a2 2 0 00-2-2v0a2 2 0 00-2 2v0"/><path d="M14 10V4a2 2 0 00-2-2v0a2 2 0 00-2 2v2"/><path d="M10 10.5V6a2 2 0 00-2-2v0a2 2 0 00-2 2v8"/><path d="M18 8a2 2 0 114 0v6a8 8 0 01-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 012.83-2.82L7 15"/></svg></button>
      <button class="tool-btn" id="zoomToggle" title="ズーム"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
      <div class="tool-separator"></div>
      <button class="tool-btn" id="uploadBtn"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <button class="tool-btn" id="clearBtn"><svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
    </div>

    <div class="brush-panel show" id="brushPanel">
      <div class="panel-section-title">ブラシ</div>
      <div class="brush-grid">
        <button class="brush-item active" data-brush="pen"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>ペン</button>
        <button class="brush-item" data-brush="pencil"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5z"/><line x1="15" y1="5" x2="19" y2="9"/></svg>鉛筆</button>
        <button class="brush-item" data-brush="marker"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l-5 5v4h4l5-5"/><path d="M13 7l4 4"/><path d="M15 5l4 4a2 2 0 010 3l-3 3-7-7 3-3a2 2 0 013 0z"/></svg>マーカー</button>
        <button class="brush-item" data-brush="chalk"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="10" width="18" height="8" rx="2" transform="rotate(-20 12 14)"/></svg>チョーク</button>
        <button class="brush-item" data-brush="blur"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity="0.6"/><circle cx="12" cy="12" r="10" opacity="0.3"/></svg>ぼかし</button>
        <button class="brush-item" data-brush="spray"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="1"/><circle cx="15" cy="7" r="1"/><circle cx="17" cy="13" r="1"/><circle cx="13" cy="15" r="1"/><circle cx="7" cy="14" r="1"/><circle cx="11" cy="11" r="1"/></svg>スプレー</button>
        <button class="brush-item" data-brush="highlighter"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l-5 5v4h4l5-5"/><path d="M15 5l4 4a2 2 0 010 3l-3 3-7-7 3-3a2 2 0 013 0z"/><path d="M2 21h20" opacity="0.4"/></svg>蛍光</button>
        <button class="brush-item" data-brush="dotted"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="6" y2="12"/><line x1="9" y1="12" x2="12" y2="12"/><line x1="15" y1="12" x2="18" y2="12"/><line x1="21" y1="12" x2="21.5" y2="12"/></svg>点線</button>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-viewport" id="canvasViewport">
        <div class="canvas-transform" id="canvasTransform">
          <div class="canvas-frame" id="canvasFrame">
            <canvas id="drawCanvas" width="900" height="675"></canvas>
          </div>
        </div>
      </div>
      <div class="collab-badge" id="collabBadge"><div class="dot"></div><span id="collabBadgeText">共同描画中</span></div>
      <div class="participants-bar" id="participantsBar"></div>
      <div class="stabilizer-indicator" id="stabilizerIndicator"><div class="dot"></div><span>手ブレ補正 ON</span></div>
      <div class="image-edit-overlay" id="imageEditOverlay">
        <div class="image-edit-box" id="imageEditBox">
          <div class="image-edit-handle tl" data-handle="tl"></div>
          <div class="image-edit-handle tr" data-handle="tr"></div>
          <div class="image-edit-handle bl" data-handle="bl"></div>
          <div class="image-edit-handle br" data-handle="br"></div>
          <div class="image-edit-handle rotate" data-handle="rotate"></div>
        </div>
        <div class="image-edit-toolbar" id="imageEditToolbar">
          <button id="imgConfirmBtn" class="confirm">✓</button>
          <button id="imgResetBtn">↺</button>
          <button id="imgCancelBtn" class="cancel">✕</button>
        </div>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomInBtn">＋</button>
        <button class="zoom-btn" id="zoomOutBtn">－</button>
        <button class="zoom-btn" id="zoomResetBtn">⛶</button>
      </div>
    </div>

    <div class="right-panels">
      <div class="panel">
        <div class="panel-title">カラー</div>
        <div class="color-main-row">
          <div class="color-swatch-big" id="colorSwatchBig"><div class="checker"></div><div class="fill" id="colorSwatchFill" style="background:#1e2b3c"></div></div>
          <div class="color-hex-row"><span class="hash">#</span><input type="text" id="hexInput" maxlength="6" value="1E2B3C"></div>
          <button class="eyedropper-btn" id="eyedropperBtn">💧</button>
        </div>
        <div class="picker-tabs"><button class="picker-tab active" data-tab="rgb">RGB</button><button class="picker-tab" data-tab="hsl">HSL</button></div>
        <div class="picker-panel active" data-panel="rgb">
          <div class="chan-row"><div class="chan-label">R</div><input type="range" id="sliderR" min="0" max="255" value="30"><div class="chan-value" id="valR">30</div></div>
          <div class="chan-row"><div class="chan-label">G</div><input type="range" id="sliderG" min="0" max="255" value="43"><div class="chan-value" id="valG">43</div></div>
          <div class="chan-row"><div class="chan-label">B</div><input type="range" id="sliderB" min="0" max="255" value="60"><div class="chan-value" id="valB">60</div></div>
        </div>
        <div class="picker-panel" data-panel="hsl">
          <div class="chan-row"><div class="chan-label">H</div><input type="range" id="sliderH" min="0" max="360" value="215"><div class="chan-value" id="valH">215</div></div>
          <div class="chan-row"><div class="chan-label">S</div><input type="range" id="sliderS" min="0" max="100" value="33"><div class="chan-value" id="valS">33</div></div>
          <div class="chan-row"><div class="chan-label">L</div><input type="range" id="sliderL" min="0" max="100" value="18"><div class="chan-value" id="valL">18</div></div>
        </div>
        <div class="preset-title">プリセット</div>
        <div class="color-presets" id="colorPresets"></div>
        <div class="panel-title" style="margin-top:14px;">ブラシ設定</div>

// ★ 手ブレ補正：RDPアルゴリズムで点を間引き
function rdpSimplify(points, epsilon) {

function perpendicularDistance(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;

// 図形認識：円・四角・直線を判定

function startDrawing(e) {

  }

function draw(e) {
  if (!isDrawing) return; e.preventDefault();
  const coords = getCanvasCoords(e); if (!coords) return;
  const layer = getActiveLayer(); if (!layer || !layer.visible) return;
  if (isMoveMode && moveSnapshot) {
    const dx = Math.round(coords.x - moveStartX), dy = Math.round(coords.y - moveStartY);
    if (dx === moveOffsetX && dy === moveOffsetY) return;

  }

    strokePoints.push({ x: coords.logicalX, y: coords.logicalY });
    lastLogicalX = coords.logicalX; lastLogicalY = coords.logicalY;

  if (activeSessionId && myCurrentStrokeId) {
    const dist = Math.hypot(coords.logicalX - myLastSentLogical.x, coords.logicalY - myLastSentLogical.y);
    if (dist >= STROKE_MIN_LOGICAL_DIST) {
      sendStrokeEvent({ type: 'move', strokeId: myCurrentStrokeId, x: coords.logicalX, y: coords.logicalY });
      myLastSentLogical = { x: coords.logicalX, y: coords.logicalY };

function enterImageEditMode(img, layerId) {

  let dw, dh;
  if (imgRatio > canvasRatio) { dw = BASE_W; dh = BASE_W / imgRatio; } else { dh = BASE_H; dw = BASE_H * imgRatio; }
  imageEditState.w = dw; imageEditState.h = dh;
  imageEditState.x = (BASE_W - dw) / 2; imageEditState.y = (BASE_H - dh) / 2;
  const layer = layers.find(l => l.id === layerId);
  if (layer) { layer._preEditData = layer.ctx.getImageData(0, 0, W, H); layer.ctx.clearRect(0, 0, W, H); composite(); }
  imageEditOverlay.classList.add('active'); updateImageEditBox();

async function handleLogin() {
  loginError.style.display = 'none'; loginError.textContent = ''; googleLoginBtn.disabled = true;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { try { await setPersistence(auth, browserLocalPersistence); } catch (e) {} await signInWithPopup(auth, provider); }
  catch (e) {
    let msg = '';
    if (e.code === 'auth/unauthorized-domain') msg = 'このドメインは許可されていません。';
    else if (e.code === 'auth/popup-blocked') msg = 'ポップアップがブロックされました。';
    else if (e.code === 'auth/popup-closed-by-user') msg = 'ログインがキャンセルされました。';
    else if (e.code === 'auth/operation-not-allowed') msg = 'Google ログインが有効化されていません。';
    else msg = 'ログインに失敗: ' + (e.message || e.code || String(e));
    loginError.textContent = msg; loginError.style.display = 'block';
  } finally { googleLoginBtn.disabled = false; }
}

      currentUser = user;

function cleanupListeners() {
  if (friendsUnsubscribe) { try { friendsUnsubscribe(); } catch(e){} friendsUnsubscribe = null; }
  if (requestsUnsubscribe) { try { requestsUnsubscribe(); } catch(e){} requestsUnsubscribe = null; }
  if (invitesUnsubscribe) { try { invitesUnsubscribe(); } catch(e){} invitesUnsubscribe = null; }
  if (sessionUnsubscribe) { try { sessionUnsubscribe(); } catch(e){} sessionUnsubscribe = null; }
  if (strokesUnsubscribe) { try { strokesUnsubscribe(); } catch(e){} strokesUnsubscribe = null; }
  if (layerEventsUnsubscribe) { try { layerEventsUnsubscribe(); } catch(e){} layerEventsUnsubscribe = null; }
  if (historyEventsUnsubscribe) { try { historyEventsUnsubscribe(); } catch(e){} historyEventsUnsubscribe = null; }
  if (resendRequestUnsubscribe) { try { resendRequestUnsubscribe(); } catch(e){} resendRequestUnsubscribe = null; }
  friends = {}; pendingRequests = {};
  activeSessionId = null; activeSessionOwnerId = null; sessionRole = null;
  shownInviteIds.clear(); incomingInviteQueue = []; isShowingInviteModal = false;
  remoteStrokesById = {};
  selectedInviteUids.clear();
  participantsBar.classList.remove('show'); participantsBar.innerHTML = '';
}

function startFriendsListener() {
  friendsUnsubscribe = onValue(ref(db, 'friends/' + currentUser.uid), (snap) => { friends = snap.val() || {}; renderFriendsList(); renderInviteFriendList(); }, () => { friends = {}; renderFriendsList(); });
}
function startRequestsListener() {
  requestsUnsubscribe = onValue(ref(db, 'userFriendRequests/' + currentUser.uid), async (snap) => {
    try {
      const ids = snap.val() || {}; pendingRequests = {};
      await Promise.all(Object.keys(ids).map(async (reqId) => {
        try { const r = await get(ref(db, 'friendRequests/' + reqId)); if (r.exists()) { const data = r.val(); if (data.status === 'pending' && data.to === currentUser.uid) pendingRequests[reqId] = data; } } catch (e) {}
      }));
      renderRequestsPanel(); updateFriendBadge();
    } catch (e) {}
  });
}
function startInviteListener() {
  if (invitesUnsubscribe) { try { invitesUnsubscribe(); } catch(e){} invitesUnsubscribe = null; }
  invitesUnsubscribe = onValue(ref(db, 'sessionInvites/' + currentUser.uid), async (snap) => {
    try {
      const invites = snap.val() || {}; const sessionIds = Object.keys(invites).filter(id => invites[id] === true);
      for (const sid of sessionIds) {
        if (shownInviteIds.has(sid)) continue;
        try {
          const sSnap = await get(ref(db, 'sessions/' + sid));
          if (sSnap.exists()) { const s = sSnap.val(); if ((s.status === 'pending' || s.status === 'active') && s.guestIds && s.guestIds.includes(currentUser.uid)) { shownInviteIds.add(sid); incomingInviteQueue.push({ sessionId: sid, session: s }); } }
        } catch (e) {}
      }
      processInviteQueue();
    } catch (e) {}
  });
}
function processInviteQueue() { if (isShowingInviteModal) return; if (incomingInviteQueue.length === 0) return; const next = incomingInviteQueue.shift(); showIncomingInvite(next.sessionId, next.session); }
function renderFriendsList() {
  const ids = Object.keys(friends); friendCount.textContent = ids.length + '人';
  if (ids.length === 0) { friendList.innerHTML = '<div class="friend-empty">まだ友達がいません。</div>'; return; }
  friendList.innerHTML = ids.map(uid => {
    const f = friends[uid];
    const photo = f.photoURL || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27%23555%27%3E%3Ccircle cx=%2712%27 cy=%278%27 r=%274%27/%3E%3C/svg%3E';
    return `<div class="friend-item"><img src="${photo}"><div class="friend-info"><div class="name">${escapeHtml(f.displayName || '名無し')}</div><div class="email">${escapeHtml(f.email || '')}</div></div></div>`;
  }).join('');
}
function renderInviteFriendList() {
  const ids = Object.keys(friends);
  if (ids.length === 0) { inviteFriendList.innerHTML = '<div class="friend-empty">招待できる友達がいません。</div>'; return; }
  inviteFriendList.innerHTML = ids.map(uid => {

function renderRequestsPanel() {
  const ids = Object.keys(pendingRequests);
  if (ids.length === 0) { requestsPanel.style.display = 'none'; return; }
  requestsPanel.style.display = 'block';
  Promise.all(ids.map(async (rid) => { const r = pendingRequests[rid]; try { const uSnap = await get(ref(db, 'users/' + r.from)); return { rid, u: uSnap.val() || {} }; } catch (e) { return { rid, u: {} }; } })).then(items => {
    requestList.innerHTML = items.map(({rid, u}) => `<div class="friend-item"><img src="${u.photoURL || ''}"><div class="friend-info"><div class="name">${escapeHtml(u.displayName || '名無し')}</div><div class="email">${escapeHtml(u.email || '')}</div></div><button data-rid="${rid}" data-action="accept" class="accept">承認</button><button data-rid="${rid}" data-action="reject">拒否</button></div>`).join('');
    requestList.querySelectorAll('button[data-action]').forEach(btn => { btn.addEventListener('click', () => handleRequestAction(btn.dataset.rid, btn.dataset.action)); });
  });
}
async function handleRequestAction(rid, action) {
  try {
    const rSnap = await get(ref(db, 'friendRequests/' + rid)); if (!rSnap.exists()) return;
    const r = rSnap.val();
    if (action === 'accept') {
      const now = Date.now();
      const fromSnap = await get(ref(db, 'users/' + r.from)), toSnap = await get(ref(db, 'users/' + currentUser.uid));
      const fromUser = fromSnap.val() || {}, toUser = toSnap.val() || {};
      const updates = {};
      updates['friends/' + r.from + '/' + currentUser.uid] = { uid: currentUser.uid, displayName: toUser.displayName || '', email: toUser.email || '', photoURL: toUser.photoURL || '', since: now };
      updates['friends/' + currentUser.uid + '/' + r.from] = { uid: r.from, displayName: fromUser.displayName || '', email: fromUser.email || '', photoURL: fromUser.photoURL || '', since: now };
      updates['friendRequests/' + rid + '/status'] = 'accepted';
      updates['userFriendRequests/' + currentUser.uid + '/' + rid] = null;
      updates['userFriendRequests/' + r.from + '/' + rid] = null;
      await update(ref(db), updates); showToast('友達になりました', 'success');
    } else {
      const updates = {};
      updates['friendRequests/' + rid + '/status'] = 'rejected';
      updates['userFriendRequests/' + currentUser.uid + '/' + rid] = null;
      updates['userFriendRequests/' + r.from + '/' + rid] = null;
      await update(ref(db), updates); showToast('拒否しました');
    }
  } catch (e) {}
}

function captureLayersSnapshot() {
  return layers.map(l => ({ id: l.id, name: l.name, visible: l.visible, opacity: l.opacity, dataURL: l.canvas.toDataURL('image/png') }));
}

async function uploadLayersSnapshotToSession(sessionId, ownerId) {
  if (!sessionId || !ownerId) return false;
  try {
    const layersData = captureLayersSnapshot();
    await set(ref(db, 'sessionSnapshots/' + sessionId), { ownerId, layers: layersData, activeLayerId, layerCounter, updatedAt: Date.now() });
    return true;
  } catch (e) { console.error('[snapshot] upload FAILED:', e); return false; }
}

async function applyLayersSnapshot(snapshotData) {
  const layersData = snapshotData.layers;
  if (!Array.isArray(layersData) || layersData.length === 0) throw new Error('レイヤーデータが空です');
  setInternalResolution();
  const newLayers = [];
  let maxCounter = 0;
  for (const ld of layersData) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const lctx = c.getContext('2d', { willReadFrequently: true });
    await new Promise((res) => {
      const img = new Image();
      img.onload = () => { lctx.drawImage(img, 0, 0, W, H); res(); };
      img.onerror = () => res();
      img.src = ld.dataURL;
    });
    newLayers.push({ id: ld.id, name: ld.name || 'レイヤー', canvas: c, ctx: lctx, visible: ld.visible !== undefined ? ld.visible : true, opacity: ld.opacity !== undefined ? ld.opacity : 1 });
    const num = parseInt((ld.id || '').replace('layer_', '')) || 0;
    if (num > maxCounter) maxCounter = num;
  }
  layers = newLayers;
  layerCounter = snapshotData.layerCounter || maxCounter;
  activeLayerId = snapshotData.activeLayerId || layers[layers.length - 1].id;
  if (!layers.some(l => l.id === activeLayerId)) activeLayerId = layers[layers.length - 1].id;
  renderLayerList(); composite();
  history = []; historyIndex = -1;
  pushHistory();
  requestAnimationFrame(() => requestAnimationFrame(() => autoFitCanvas()));
}

async function downloadLayersSnapshotFromSession(sessionId, maxRetries = 3) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    try {
      const snap = await get(ref(db, 'sessionSnapshots/' + sessionId));
      if (snap.exists()) {
        const data = snap.val();
        if (data && Array.isArray(data.layers) && data.layers.length > 0) { await applyLayersSnapshot(data); return true; }
      }
    } catch (e) { console.warn('[snapshot] attempt error:', e); }
    if (attempt < maxRetries) await new Promise(r => setTimeout(r, 600 * attempt));
  }
  return false;
}

function startResendListener(sessionId, ownerId) {
  if (resendRequestUnsubscribe) { try { resendRequestUnsubscribe(); } catch(e){} resendRequestUnsubscribe = null; }
  resendRequestUnsubscribe = onValue(ref(db, 'snapshotResendRequests/' + sessionId), async (snap) => {
    if (snap.exists() && snap.val() === true) {
      try { await uploadLayersSnapshotToSession(sessionId, ownerId); await remove(ref(db, 'snapshotResendRequests/' + sessionId)); } catch (e) {}
    }
  });
}

async function inviteFriendsToCanvas(friendUids) {
  if (activeSessionId) { showToast('既に共同描画セッション中です', 'error'); return; }
  try {
    showLoading(true);
    const sessionRef = push(ref(db, 'sessions')); const sessionId = sessionRef.key;
    const participants = [
      { uid: currentUser.uid, displayName: currentUser.displayName || '名無し', photoURL: currentUser.photoURL || '', role: 'owner' },
      ...friendUids.map(uid => { const f = friends[uid] || {}; return { uid, displayName: f.displayName || '名無し', photoURL: f.photoURL || '', role: 'guest' }; })
    ];
    await set(sessionRef, { ownerId: currentUser.uid, ownerName: currentUser.displayName || '名無し', guestIds: friendUids, participants, status: 'pending', createdAt: Date.now(), startedAt: null });
    const ok = await uploadLayersSnapshotToSession(sessionId, currentUser.uid);
    if (!ok) { showToast('キャンバスの保存に失敗しました', 'error'); try { await remove(ref(db, 'sessions/' + sessionId)); } catch(e){} return; }
    const updates = {};
    friendUids.forEach(uid => { updates['sessionInvites/' + uid + '/' + sessionId] = true; });
    await update(ref(db), updates);
    activeSessionId = sessionId; activeSessionOwnerId = currentUser.uid; sessionRole = 'owner';
    await attachSessionListener(sessionId);
    startResendListener(sessionId, currentUser.uid);
    showToast(`${friendUids.length}人に招待を送信しました`, 'success');
    inviteModal.classList.remove('show');
    selectedInviteUids.clear();
  } catch (e) { showToast('招待に失敗: ' + e.message, 'error'); }
  finally { showLoading(false); }
}

async function attachSessionListener(sessionId) {
  if (sessionUnsubscribe) { try { sessionUnsubscribe(); } catch(e){} sessionUnsubscribe = null; }
  sessionUnsubscribe = onValue(ref(db, 'sessions/' + sessionId), async (snap) => {
    if (!snap.exists()) { if (activeSessionId === sessionId) { await cleanupSession(); showToast('セッションが終了しました'); } return; }
    const s = snap.val();
    if (activeSessionId !== sessionId) { activeSessionId = sessionId; activeSessionOwnerId = s.ownerId; }
    updateParticipantsBar(s.participants || []);
    if (s.status === 'active' || s.status === 'pending') {
      collabBadge.classList.add('show');
      const otherNames = (s.participants || []).filter(p => p.uid !== currentUser.uid).map(p => p.displayName).join(', ');
      collabBadgeText.textContent = `共同描画中: ${otherNames || '待機中'}`;
      if (!strokesUnsubscribe) startStrokesListener(sessionId);
      if (!layerEventsUnsubscribe) startLayerEventsListener(sessionId);
      if (!historyEventsUnsubscribe) startHistoryEventsListener(sessionId);
    } else if (s.status === 'declined') { showToast('招待が拒否されました', 'error'); await cleanupSession(); }
    else if (s.status === 'ended') { showToast('セッションが終了しました'); await cleanupSession(); }
  });
}

function updateParticipantsBar(participants) {
  if (!participants || participants.length <= 1) { participantsBar.classList.remove('show'); participantsBar.innerHTML = ''; return; }
  participantsBar.classList.add('show');
  participantsBar.innerHTML = participants.map(p => `<img class="participant-avatar" src="${p.photoURL || ''}" title="${escapeHtml(p.displayName)}">`).join('') + `<span class="participant-count">${participants.length}人</span>`;
}

    incomingInviteModal.classList.remove('show'); isShowingInviteModal = false;
    if (activeSessionId) await cleanupSession();
    try {
      showLoading(true);
      await update(ref(db, 'sessions/' + sessionId), { status: 'active', startedAt: Date.now() });
      await remove(ref(db, 'sessionInvites/' + currentUser.uid + '/' + sessionId));
      shownInviteIds.delete(sessionId);
      activeSessionId = sessionId; activeSessionOwnerId = session.ownerId; sessionRole = 'guest';
      showEditorScreen();
      await new Promise(r => setTimeout(r, 400));
      showToast('相手のキャンバスを読み込んでいます...', 'success');

        showToast('再取得を試みています...', 'success');
        try { await set(ref(db, 'snapshotResendRequests/' + sessionId), true); await new Promise(r => setTimeout(r, 1500)); applied = await downloadLayersSnapshotFromSession(sessionId, 5); } catch (e) {}
      }

async function sendStrokeEvent(event) {
  if (!activeSessionId) return;
  try { const r = push(ref(db, 'strokes/' + activeSessionId)); await set(r, { ...event, uid: currentUser.uid, timestamp: Date.now() }); } catch (e) {}
}
function startStrokesListener(sessionId) {
  if (strokesUnsubscribe) { try { strokesUnsubscribe(); } catch(e){} strokesUnsubscribe = null; }
  const strokesRef = ref(db, 'strokes/' + sessionId);
  const existingKeys = new Set();
  const initialLoad = new Promise((resolve) => {
    get(strokesRef).then((snap) => { if (snap.exists()) Object.keys(snap.val()).forEach(k => existingKeys.add(k)); resolve(); }).catch(() => resolve());
  });
  strokesUnsubscribe = onChildAdded(strokesRef, async (childSnap) => {
    await initialLoad;
    const key = childSnap.key; if (existingKeys.has(key)) return;
    const ev = childSnap.val(); if (!ev) return;
    if (ev.uid === currentUser.uid) return;
    applyRemoteStrokeEvent(ev);
  });
}
function applyRemoteStrokeEvent(ev) {
  isApplyingRemote = true;
  try {
    let layer = null;
    if (ev.layerId) layer = layers.find(l => l.id === ev.layerId);
    if (!layer) layer = getActiveLayer();
    if (!layer || !layer.visible) return;
    if (ev.type === 'start') {
      remoteStrokesById[ev.strokeId] = { lastLogicalX: ev.x, lastLogicalY: ev.y, layerId: ev.layerId, color: ev.color, size: ev.size, brush: ev.brush, opacity: ev.opacity, eraser: ev.eraser, seed: ev.seed };
      drawStrokeToLayer(layer, ev.x, ev.y, ev.x + 0.01, ev.y, { color: ev.color, size: ev.size, brush: ev.brush, alpha: ev.opacity || 1, eraser: ev.eraser }, ev.seed);
      composite();
    } else if (ev.type === 'move') {
      const s = remoteStrokesById[ev.strokeId]; if (!s) return;
      let targetLayer = layers.find(l => l.id === s.layerId) || layer;
      if (!targetLayer || !targetLayer.visible) return;
      drawStrokeToLayer(targetLayer, s.lastLogicalX, s.lastLogicalY, ev.x, ev.y, { color: s.color, size: s.size, brush: s.brush, alpha: s.opacity || 1, eraser: s.eraser }, s.seed);
      s.lastLogicalX = ev.x; s.lastLogicalY = ev.y;
      composite();
    } else if (ev.type === 'end') { delete remoteStrokesById[ev.strokeId]; }
  } finally { isApplyingRemote = false; }
}

async function sendLayerEvent(event) {
  if (!activeSessionId) return;
  try { const r = push(ref(db, 'layerEvents/' + activeSessionId)); await set(r, { ...event, uid: currentUser.uid, timestamp: Date.now() }); } catch (e) {}
}
function startLayerEventsListener(sessionId) {
  if (layerEventsUnsubscribe) { try { layerEventsUnsubscribe(); } catch(e){} layerEventsUnsubscribe = null; }
  const layerEventsRef = ref(db, 'layerEvents/' + sessionId);
  const existingKeys = new Set();
  const initialLoad = new Promise((resolve) => {
    get(layerEventsRef).then((snap) => { if (snap.exists()) Object.keys(snap.val()).forEach(k => existingKeys.add(k)); resolve(); }).catch(() => resolve());
  });
  layerEventsUnsubscribe = onChildAdded(layerEventsRef, async (childSnap) => {
    await initialLoad;
    const key = childSnap.key; if (existingKeys.has(key)) return;
    const ev = childSnap.val(); if (!ev) return;
    if (ev.uid === currentUser.uid) return;
    applyRemoteLayerEvent(ev);
  });
}
function applyRemoteLayerEvent(ev) {
  isApplyingRemote = true;
  try {
    if (ev.type === 'add') {
      if (layers.some(l => l.id === ev.layerId)) return;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const lctx = c.getContext('2d', { willReadFrequently: true });
      layers.push({ id: ev.layerId, name: ev.name || 'レイヤー', canvas: c, ctx: lctx, visible: true, opacity: 1 });
      const num = parseInt((ev.layerId || '').replace('layer_', '')) || 0;
      if (num > layerCounter) layerCounter = num;
      renderLayerList(); composite();
    } else if (ev.type === 'delete') {
      const idx = layers.findIndex(l => l.id === ev.layerId);
      if (idx === -1 || layers.length <= 1) return;
      layers.splice(idx, 1);
      if (activeLayerId === ev.layerId) activeLayerId = layers[Math.min(idx, layers.length-1)].id;
      renderLayerList(); composite();
    } else if (ev.type === 'visibility') {
      const layer = layers.find(l => l.id === ev.layerId);
      if (layer) { layer.visible = ev.visible; renderLayerList(); composite(); }
    } else if (ev.type === 'reorder') {
      const fromIdx = layers.findIndex(l => l.id === ev.layerId);
      if (fromIdx === -1) return;
      const [moved] = layers.splice(fromIdx, 1);
      let newToIdx = layers.findIndex(l => l.id === ev.targetId);
      if (newToIdx === -1) newToIdx = layers.length - 1;
      let insertIdx = ev.position === 'above' ? newToIdx + 1 : newToIdx;
      insertIdx = Math.max(0, Math.min(insertIdx, layers.length));
      layers.splice(insertIdx, 0, moved);
      renderLayerList(); composite();
    }
  } finally { isApplyingRemote = false; }
}

async function sendHistoryEvent(event) {
  if (!activeSessionId) return;
  try { const r = push(ref(db, 'historyEvents/' + activeSessionId)); await set(r, { ...event, uid: currentUser.uid, timestamp: Date.now() }); } catch (e) {}
}
function startHistoryEventsListener(sessionId) {
  if (historyEventsUnsubscribe) { try { historyEventsUnsubscribe(); } catch(e){} historyEventsUnsubscribe = null; }
  const historyEventsRef = ref(db, 'historyEvents/' + sessionId);
  const existingKeys = new Set();
  const initialLoad = new Promise((resolve) => {
    get(historyEventsRef).then((snap) => { if (snap.exists()) Object.keys(snap.val()).forEach(k => existingKeys.add(k)); resolve(); }).catch(() => resolve());
  });
  historyEventsUnsubscribe = onChildAdded(historyEventsRef, async (childSnap) => {
    await initialLoad;
    const key = childSnap.key; if (existingKeys.has(key)) return;
    const ev = childSnap.val(); if (!ev) return;
    if (ev.uid === currentUser.uid) return;
    await applyRemoteHistoryEvent(ev);
  });
}
async function applyRemoteHistoryEvent(ev) {
  if (ev.type === 'jump' || ev.type === 'push') {
    isApplyingRemoteHistory = true;
    try {
      const snapshot = ev.layersSnapshot;
      if (!Array.isArray(snapshot) || snapshot.length === 0) return;
      if (ev.W && ev.H && (ev.W !== W || ev.H !== H)) { W = ev.W; H = ev.H; canvas.width = W; canvas.height = H; applyCanvasCSSSize(); }
      isLoading = true;
      const loadPromises = snapshot.map(layerData => new Promise(resolve => {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const lctx = c.getContext('2d', { willReadFrequently: true });
        const img = new Image();
        const finalize = () => resolve({ id: layerData.id, name: layerData.name, canvas: c, ctx: lctx, visible: layerData.visible, opacity: layerData.opacity });
        img.onload = () => { lctx.drawImage(img, 0, 0, W, H); finalize(); };
        img.onerror = finalize;
        img.src = layerData.dataURL;
      }));
      layers = await Promise.all(loadPromises);
      activeLayerId = ev.activeLayerId || layers[layers.length - 1].id;
      layerCounter = ev.layerCounter || layerCounter;
      renderLayerList(); composite();
      if (typeof ev.index === 'number') historyIndex = ev.index;
      updateUndoRedo();
      isLoading = false;
    } catch (e) { isLoading = false; }
    finally { isApplyingRemoteHistory = false; }
  }
}

async function cleanupSession() {
  if (sessionUnsubscribe) { try { sessionUnsubscribe(); } catch(e){} sessionUnsubscribe = null; }
  if (strokesUnsubscribe) { try { strokesUnsubscribe(); } catch(e){} strokesUnsubscribe = null; }
  if (layerEventsUnsubscribe) { try { layerEventsUnsubscribe(); } catch(e){} layerEventsUnsubscribe = null; }
  if (historyEventsUnsubscribe) { try { historyEventsUnsubscribe(); } catch(e){} historyEventsUnsubscribe = null; }
  if (resendRequestUnsubscribe) { try { resendRequestUnsubscribe(); } catch(e){} resendRequestUnsubscribe = null; }
  remoteStrokesById = {};
  collabBadge.classList.remove('show');
  participantsBar.classList.remove('show'); participantsBar.innerHTML = '';
  if (activeSessionId) {
    try {
      await update(ref(db, 'sessions/' + activeSessionId), { status: 'ended' });
      await remove(ref(db, 'sessionInvites/' + currentUser.uid + '/' + activeSessionId));
      await remove(ref(db, 'strokes/' + activeSessionId));
      await remove(ref(db, 'layerEvents/' + activeSessionId));
      await remove(ref(db, 'historyEvents/' + activeSessionId));
      await remove(ref(db, 'sessionSnapshots/' + activeSessionId));
      await remove(ref(db, 'snapshotResendRequests/' + activeSessionId));
    } catch (e) {}
  }
  activeSessionId = null; activeSessionOwnerId = null; sessionRole = null;
}

renderColorPresets();
syncColorUI();
updateSizePreview();
updateOpacityPreview();
setupImageEditInteractions();
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
